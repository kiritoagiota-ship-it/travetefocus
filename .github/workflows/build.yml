name: Build TraveteFocus APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write          # publicar o APK na pagina Releases

    steps:

      # ── 1. CÓDIGO FONTE ────────────────────────────────────────────────────
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # ── 2. JAVA ────────────────────────────────────────────────────────────
      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. PYTHON ──────────────────────────────────────────────────────────
      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── 4a. CACHE — pacotes ~/.buildozer ───────────────────────────────────
      # Guarda os pacotes Python baixados pelo buildozer (Kivy wheel, etc.)
      - name: Cache Buildozer (~/.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec') }}

      # ── 4b. CACHE — compilação do projeto (.buildozer/android) ─────────────
      # NOVO: guarda os binários do Kivy já compilados para Android.
      # Sem este cache, os 17 min de compilação se repetem em cada push.
      # Com ele, a partir da 2ª execução o build cai para ~3-5 min.
      - name: Cache compilação p4a (.buildozer/android)
        uses: actions/cache@v4
        with:
          path: .buildozer/android
          key: ${{ runner.os }}-p4a-build-v2-${{ hashFiles('buildozer.spec') }}

      # ── 5. DEPENDÊNCIAS DO SISTEMA ─────────────────────────────────────────
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      # ── 6. FERRAMENTAS PYTHON ──────────────────────────────────────────────
      - name: Instalar Cython 0.29.36 e Buildozer 1.5.0
        run: |
          pip install --upgrade pip wheel
          pip install Cython==0.29.36
          pip install buildozer==1.5.0


      # ── KEYSTORE PERMANENTE ───────────────────────────────────────────────
      # Restaura o keystore salvo como GitHub Secret (KEYSTORE_BASE64).
      # Garante que TODOS os builds usam o mesmo certificado → APK sempre
      # atualiza sem conflito. Sem esse secret, Android rejeita a instalação.
      - name: Restaurar keystore de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # A chave vai para um arquivo proprio: o Gradle assina com a chave
          # de debug dele e, no fim, o APK e assinado de novo com esta.
          mkdir -p ~/.android
          if [ -z "$KS_B64" ]; then
            echo "::warning::Falta o secret KEYSTORE_BASE64: o APK sai com chave temporaria (para instalar vai precisar apagar o app)."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > ~/.android/travete.keystore
          echo "[KEYSTORE] $(wc -c < ~/.android/travete.keystore) bytes restaurados"
          exit 0

      # ── 7. VARIÁVEIS ANDROID ───────────────────────────────────────────────
      - name: Exportar variáveis de ambiente Android SDK/NDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk"                   >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk"                       >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724" >> $GITHUB_ENV

      # ── 8. SYMLINK sdkmanager ──────────────────────────────────────────────
      - name: Criar symlink sdkmanager (compatibilidade buildozer 1.5.0)
        run: |
          mkdir -p /usr/local/lib/android/sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
                  /usr/local/lib/android/sdk/tools/bin/sdkmanager
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager \
                  /usr/local/lib/android/sdk/tools/bin/avdmanager

      # ── 9. LICENÇAS SDK ────────────────────────────────────────────────────
      - name: Aceitar licenças do Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            --licenses 2>/dev/null || true

      # ── 9b. PATCH p4a (bug do venv com 2 arquiteturas) ─────────────────────
      # O p4a v2026.05.09 roda `python -m venv venv` de novo na 2ª arquitetura
      # sobre o venv já existente, misturando pip 26 com pip 25.3 (quebrado).
      # Apagamos o venv antes de recriá-lo e usamos essa cópia via source_dir.
      - name: Clonar e corrigir python-for-android
        run: |
          git clone -q --depth 1 -b v2026.05.09 https://github.com/kivy/python-for-android.git "$GITHUB_WORKSPACE/p4a-src"
          python - <<'PY'
          import os
          p = os.path.join(os.environ["GITHUB_WORKSPACE"], "p4a-src", "pythonforandroid", "build.py")
          s = open(p, encoding="utf-8").read()
          old = "        shprint(host_python, '-m', 'venv', 'venv')"
          assert s.count(old) == 1, "trecho do venv nao encontrado"
          s = s.replace(old, "        shutil.rmtree('venv', ignore_errors=True)" + chr(10) + old)
          open(p, "w", encoding="utf-8").write(s)
          PY
          python .github/manifest_lembrete.py "$GITHUB_WORKSPACE/p4a-src"
          sed -i '/^p4a.branch/d' buildozer.spec
          sed -i "/^p4a.hook/a p4a.source_dir = $GITHUB_WORKSPACE/p4a-src" buildozer.spec
          grep -n "^p4a" buildozer.spec

      # ── 9c. VERSAO ─────────────────────────────────────────────────────────
      # O nome da versao vem do arquivo VERSAO (1.3, 1.4, ... - escolha do
      # usuario: cada atualizacao sobe 1). O numero INTERNO (versionCode) e o
      # que o Android compara para instalar por cima: ele tem que ser SEMPRE
      # maior que o anterior, senao o celular recusa e obrigaria a desinstalar
      # (perderia as anotacoes). O automatico do python-for-android daria
      # "10"+minapi+versao: 1.0.201 -> 102110201, mas 1.3 -> 1021103 (MENOR!).
      # Por isso o numero e fixado aqui: 2xx.xxx.xxx = 200000000 + maior*1000000
      # + menor*10000 + build (1.3 no build 210 -> 201030210), sempre acima
      # de todos os 1.0.N antigos e crescendo a cada versao e a cada build.
      - name: Numero de versao
        run: |
          V=$(tr -d ' \r\n' < VERSAO)
          MAIOR=${V%%.*}
          MENOR=${V#*.}; MENOR=${MENOR%%.*}
          CODIGO=$((200000000 + MAIOR * 1000000 + MENOR * 10000 + ${{ github.run_number }} % 10000))
          sed -i "s/^version = .*/version = $V/" buildozer.spec
          sed -i '/^android.numeric_version/d' buildozer.spec
          sed -i "/^version = /a android.numeric_version = $CODIGO" buildozer.spec
          grep -n "^version\|^android.numeric_version" buildozer.spec
          echo "VERSAO_APP=$V" >> $GITHUB_ENV
          echo "::notice::TraveteFocus $V (numero interno $CODIGO)"
          # o app mostra a versao no rodape do menu
          echo "{\"versao\": \"$V\"}" > versao.json

      # ── 10. BUILD ──────────────────────────────────────────────────────────
      # O flag -v força output verboso sem alterar o buildozer.spec,
      # preservando o cache de pacotes (4a). O tee grava tudo em build.log
      # mesmo que o console do GitHub Actions trunque.
      - name: Build APK (debug, verbose)
        run: |
          set -o pipefail
          # o recebedor dos lembretes tambem nos moldes ja guardados no cache
          python .github/manifest_lembrete.py .buildozer || true
          buildozer -v android debug 2>&1 | tee build.log
          if grep -rqs "org.travetefocus.Lembrete" --include=AndroidManifest.xml .buildozer; then
            echo "::notice::Lembretes: o recebedor esta no AndroidManifest."
          else
            echo "::warning::Lembretes: o recebedor NAO entrou no AndroidManifest (os avisos nao vao aparecer)."
          fi
        timeout-minutes: 75

      # ── 10b. ASSINATURA FIXA ───────────────────────────────────────────────
      # Assina o APK de novo com a chave do secret (a mesma em todo build) e
      # mostra a impressao digital: tem que ser sempre igual para o celular
      # aceitar a atualizacao por cima.
      - name: Assinar o APK sempre com a mesma chave
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)
          ESPERADA="94ef9ec68ebd71c6ce1cc15936c440985a0fbd5900f04694009bb3bbd50709eb"
          if [ -s ~/.android/travete.keystore ] && \
             "${BT}apksigner" sign --ks ~/.android/travete.keystore --ks-pass pass:android --key-pass pass:android "$APK"; then
            DIG=$("${BT}apksigner" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}')
            echo "Impressao digital do APK: $DIG"
            if [ "$DIG" = "$ESPERADA" ]; then
              echo "::notice::APK assinado com a chave fixa do TraveteFocus: atualiza por cima."
            else
              echo "::warning::APK assinado com uma chave diferente da esperada ($DIG)."
            fi
          else
            echo "::warning::A chave do secret KEYSTORE_BASE64 nao abriu (senha android): o APK saiu com chave temporaria. Troque o secret pelo conteudo de keystore_novo_base64.txt."
          fi

      # ── 11. DIAGNÓSTICO ────────────────────────────────────────────────────
      - name: Exibir últimas 300 linhas do log
        if: always()
        run: tail -n 300 build.log || true

      # ── 12. ARTEFATOS ──────────────────────────────────────────────────────
      # ── 12. APK NA PAGINA RELEASES ─────────────────────────────────────────
      # O APK vai para a pagina "Releases" do repositorio (tag apk-mais-recente).
      # Nao ocupa o espaco de artifacts (que enche com os APKs antigos e
      # derrubava o build) e so fica o APK mais novo.
      - name: Publicar APK na pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          NOVO="bin/TraveteFocus-${VERSAO_APP}.apk"
          cp "$APK" "$NOVO"
          gh release delete apk-mais-recente --yes --cleanup-tag || true
          gh release create apk-mais-recente "$NOVO" --target "${{ github.sha }}" --latest --title "TraveteFocus ${VERSAO_APP}" --notes "APK mais recente do TraveteFocus (versao ${VERSAO_APP}, build ${{ github.run_number }}). Baixe o arquivo .apk abaixo e instale por cima do app."
          echo "::notice::APK publicado em Releases: TraveteFocus ${VERSAO_APP}"

      - name: Upload do log completo de build
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
          if-no-files-found: ignore
